name: Desplegar PDF en Supabase de pruebas
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: supabase-test-pdf-deployment
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprobar autorización
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo 'Falta el secreto SUPABASE_ACCESS_TOKEN en GitHub.' >&2
            exit 1
          fi
      - name: Desplegar solamente forms-pdf en pruebas
        run: npx --yes supabase@2.120.0 functions deploy forms-pdf --project-ref wtrelwtztkddfktrfdpb --use-api
