name: Preparar beta cerrada en Supabase de pruebas
on:
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [inspect, prepare]
        default: inspect
        required: true
      confirmation:
        description: Para preparar escribir PREPARAR_BETA_CERRADA
        type: string
        required: false
      admin_email:
        description: Cuenta separada ya registrada y confirmada (sin contraseña)
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: supabase-test-beta-preparation
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Probar protecciones de despliegue
        run: python3 -m unittest discover -s scripts/supabase -p 'test_*.py'
      - name: Probar guardas beta en PostgreSQL aislado
        run: bash supabase/tests/run_beta_gate.sh
      - name: Inspeccionar o preparar sin abrir admisiones
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          BETA_ACTION: ${{ inputs.action }}
          BETA_CONFIRMATION: ${{ inputs.confirmation }}
          BETA_ADMIN_EMAIL: ${{ inputs.admin_email }}
        run: python3 scripts/supabase/beta_schema.py
