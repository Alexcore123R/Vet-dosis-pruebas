name: Diagnosticar guardado beta (sin conservar datos de prueba)
on:
  workflow_dispatch:
    inputs:
      clinic_email:
        type: string
        required: true
      platform_email:
        type: string
        required: true
      clinic_name:
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: supabase-test-beta-preparation
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Ensayar escrituras sintéticas con rollback interno obligatorio
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          CLINIC_EMAIL: ${{ inputs.clinic_email }}
          PLATFORM_EMAIL: ${{ inputs.platform_email }}
          CLINIC_NAME: ${{ inputs.clinic_name }}
        run: python3 scripts/supabase/diagnose_beta_writes.py
      - uses: actions/upload-artifact@v4
        with:
          name: beta-write-diagnostic
          path: beta-write-diagnostic.json
          retention-days: 7
