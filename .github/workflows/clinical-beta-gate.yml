name: Puerta de beta clinica — pruebas aisladas
# Manual/sintetico. No datos reales, secrets ni despliegue a Supabase.
on:
  pull_request:
    paths:
      - '.github/workflows/clinical-beta-gate.yml'
      - 'docs/pruebas/auditoria-beta-clinica-20261021.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sql-clinical:
    name: SQL aislado — ${{ matrix.area }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - area: pacientes
            runner: run_permission_patient_registration.sh
            pdf: false
          - area: agenda
            runner: run_permission_agenda.sh
            pdf: false
          - area: consulta-y-permisos
            runner: run_permission_clinical.sh
            pdf: false
          - area: hospitalizacion
            runner: run_hospital_flexible_admission.sh
            pdf: false
          - area: medicamentos-y-alta
            runner: run_permission_hospital_resolution.sh
            pdf: false
          - area: receta-individual-y-pdf
            runner: run_prescription_individual.sh
            pdf: true
          - area: formatos-y-pdf
            runner: run_form_individual_workflow.sh
            pdf: true
          - area: caja-e-inventario
            runner: run_permission_inventory_cash.sh
            pdf: false
    steps:
      - uses: actions/checkout@v4
      - name: Preparar Node para PDF
        if: matrix.pdf
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar renderizador PDF sintetico
        if: matrix.pdf
        run: |
          npm ci --prefix supabase --ignore-scripts
          if ! command -v pdftotext >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y poppler-utils
          fi
      - name: Ejecutar contrato y concurrencia en PostgreSQL 17 sin red
        run: bash "supabase/tests/${{ matrix.runner }}"

  flutter-clinical:
    name: Interfaz clinica — regresiones Flutter
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - name: Probar pantallas y estados de los modulos clinicos
        run: |
          flutter test --timeout 5m --concurrency 2 \
            test/patients_test.dart \
            test/agenda_permission_test.dart \
            test/appointment_care_test.dart \
            test/clinical_test.dart \
            test/clinical_screen_contract_test.dart \
            test/prescribing_test.dart \
            test/prescription_workflow_test.dart \
            test/forms_test.dart \
            test/hospital_test.dart \
            test/hospital_flexible_test.dart \
            test/hospital_resolution_test.dart \
            test/inventory_test.dart \
            test/contact_timeline_billing_test.dart

# Deliberadamente no hay trabajo de instalación/deploy ni descarga de PHI.

  remote-catalog:
    name: P0 — inspección remota de contratos (solo lectura)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar configuración de acceso de inspección
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::No está configurado SUPABASE_ACCESS_TOKEN para inspección remota."
            exit 1
          fi
      - name: Comparar catálogo y dependencias sin descargar expedientes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          python3 scripts/supabase/integration_preflight.py --output clinical-beta-preflight.json
          python3 scripts/supabase/integration_dependencies.py --output clinical-beta-dependencies.json
      - name: Guardar solamente diagnóstico de esquema
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clinical-beta-remote-schema-audit
          path: |
            clinical-beta-preflight.json
            clinical-beta-dependencies.json
          if-no-files-found: ignore
          retention-days: 7
