name: Inspeccionar integración beta (solo lectura)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: supabase-test-beta-preparation
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Probar inventario y protecciones de inspección
        run: python3 -m unittest discover -s scripts/supabase -p 'test_*.py'
      - name: Comparar catálogo del proyecto de pruebas con candidatos
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: python3 scripts/supabase/integration_preflight.py --output integration-preflight.json
      - name: Comprobar dependencias del paquete atómico sin aplicar
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: python3 scripts/supabase/integration_dependencies.py --output integration-dependencies.json
      - name: Consultar disponibilidad de respaldos sin descargar datos
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: python3 scripts/supabase/integration_backup_inventory.py --output integration-backup-inventory.json
      - name: Preparar catálogo de referencia en PostgreSQL aislado
        run: bash supabase/tests/run_integration_bundle.sh --catalog-baseline integration-baseline.json
      - name: Comparar columnas y funciones remotas sin leer expedientes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: python3 scripts/supabase/integration_catalog.py --baseline integration-baseline.json --output integration-catalog-review.json
      - uses: actions/upload-artifact@v4
        with:
          name: beta-integration-preflight
          path: |
            integration-preflight.json
            integration-dependencies.json
            integration-baseline.json
            integration-catalog-review.json
            integration-backup-inventory.json
          retention-days: 7
