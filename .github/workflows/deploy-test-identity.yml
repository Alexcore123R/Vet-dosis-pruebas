name: Identidad en Supabase de pruebas
on:
  workflow_dispatch:
    inputs:
      action:
        description: Inspeccionar o aplicar solamente el esquema de identidad
        type: choice
        options: [inspect, apply]
        default: inspect
        required: true
      confirmation:
        description: Para aplicar escribir ACTIVAR_IDENTIDAD_EN_PRUEBAS
        type: string
        default: ''
        required: false
permissions:
  contents: read
concurrency:
  group: supabase-test-identity-deployment
  cancel-in-progress: false
jobs:
  identity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Probar migración y políticas en PostgreSQL aislado
        run: bash supabase/tests/run_identity.sh
      - name: Revisar o aplicar identidad en el proyecto de pruebas
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          IDENTITY_ACTION: ${{ inputs.action }}
          IDENTITY_CONFIRMATION: ${{ inputs.confirmation }}
        run: python3 scripts/supabase/identity_schema.py
