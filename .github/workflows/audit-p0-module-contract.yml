name: Auditar contrato P0 y aislamiento por clínica
on:
  pull_request:
    paths:
      - 'scripts/supabase/module_contract_readonly.py'
      - 'scripts/supabase/test_module_contract_readonly.py'
      - 'supabase/tests/module_navigation_two_clinics.sql'
      - 'supabase/tests/run_module_navigation_dashboard.sh'
      - '.github/workflows/audit-p0-module-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  remote-readonly:
    name: P0 — comparar definición remota (solo lectura)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar comparación sin consultar datos privados
        run: python3 -m unittest discover -s scripts/supabase -p test_module_contract_readonly.py
      - name: Comparar solo código de una función del proyecto de pruebas
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::No está configurado el secreto de inspección."
            exit 1
          fi
          python3 scripts/supabase/module_contract_readonly.py \
            --output module-contract-review.json \
            --diff-output module-contract-diff.txt
      - name: Guardar informe sin expedientes ni cuentas reales
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-module-contract-comparison
          path: |
            module-contract-review.json
            module-contract-diff.txt
          if-no-files-found: ignore
          retention-days: 7

  simulated-isolation:
    name: P0 — dos clínicas sintéticas en PostgreSQL aislado
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar prohibición de permisos implícitos
        run: bash supabase/tests/run_module_navigation_dashboard.sh
