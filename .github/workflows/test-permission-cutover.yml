name: Probar corte de permisos (sin despliegue)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  patient-registration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Probar alta, lectura, auditoría y concurrencia en PostgreSQL aislado
        run: bash supabase/tests/run_permission_patient_registration.sh
  agenda:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Probar agenda, agregados y concurrencia con dependencias reales
        run: bash supabase/tests/run_permission_agenda.sh
  clinical:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Probar expediente, actuaciones y revocación profesional en aislamiento
        run: bash supabase/tests/run_permission_clinical.sh
  hospital-flexible:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Probar ingreso sin jaula y cambios auditados en aislamiento
        run: bash supabase/tests/run_hospital_flexible_admission.sh
  hospital-reviews:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Probar revisiones por procedimiento y confirmaciones concurrentes
        run: bash supabase/tests/run_permission_hospital_reviews.sh
